{% extends "base.html" %}

{% block custom_style %}
  <link href="/static/chat.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="chat-container">
  <h1>Chat</h1>
  <div id="chat-box">
    {% if conversation and conversation.messages %}
      {% for msg in conversation.messages %}
        <div class="message user"><strong>Tú:</strong> {{ msg.user_message }}</div>
        <div class="message bot"><strong>Bot:</strong> {{ msg.bot_response }}</div>
      {% endfor %}
    {% endif %}
  </div>
  <div class="input-area">
    <input type="text" id="user-input" placeholder="Escribe un mensaje..." autocomplete="off">
    <button id="send-btn">Enviar</button>
  </div>
</div>

<script>
  const conversationId = "{{ conversation.id if conversation else '' }}";
  console.log("conversationId:", conversationId);  // Ayuda a depurar

  document.getElementById('send-btn').addEventListener('click', sendMessage);
  document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const userInput = document.getElementById('user-input').value.trim();
    if (userInput === "") return;

    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML += `<div class="message user"><strong>Tú:</strong> ${userInput}</div>`;

    let fetchUrl = '/prompt';
    if (conversationId) {
      fetchUrl += `?conversation_id=${conversationId}`;
    }

    fetch(fetchUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: userInput })
    })
    .then(response => response.json())
    .then(data => {
      chatBox.innerHTML += `<div class="message bot"><strong>Bot:</strong> ${data.response}</div>`;
      document.getElementById('user-input').value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(error => console.error('Error:', error));
  }

  window.addEventListener('beforeunload', function() {
    navigator.sendBeacon('{{ url_for("end_conversation") }}', JSON.stringify({}));
  });
</script>
{% endblock %}
