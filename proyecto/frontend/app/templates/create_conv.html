{% extends "base.html" %}

{% block content %}
<style>
  .centered-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 70vh;
    text-align: center;
  }

  #create-convo-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    width: 100%;
    max-width: 400px;
    margin-top: 20px;
  }

  #create-convo-form input[type="text"] {
    padding: 10px;
    font-size: 16px;
    width: 100%;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  #create-convo-form button {
    padding: 10px 20px;
    font-size: 16px;
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  #create-convo-form button:hover {
    background-color: #2980b9;
  }
</style>

<div class="container centered-container">
  <h2>Crear nueva conversación</h2>
  <form id="create-convo-form">
    <input type="text" id="conversation_name" name="conversation_name" placeholder="Título de la conversación" required>
    <button type="submit">Crear</button>
  </form>
</div>

<script>
  const form = document.getElementById('create-convo-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const conversation_name = document.getElementById('conversation_name').value.trim();
    if (!conversation_name) return alert('El título es obligatorio');

    const res = await fetch('/prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ conversation_name })
    });

    const data = await res.json();
    if (data.conversation_name) {
      window.location.href = `/prompt?conversation_name=${data.conversation_name}`;
    } else if (data.error) {
      alert('Error: ' + data.error);
    }
  });
</script>
{% endblock %}
